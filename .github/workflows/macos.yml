name: macOS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      run_macos: ${{ steps.filter.outputs.run_macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run_macos:
              - ".github/workflows/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "xtask/**"
              - "whisper-cpp-plus/**"
              - "whisper-cpp-plus-sys/**"

  test:
    name: Test
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.run_macos == 'true'
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Download test models
        run: cargo xtask test-setup

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=1

      - name: Test Metal feature
        run: cargo test -p whisper-cpp-plus --features metal -- --test-threads=1
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
